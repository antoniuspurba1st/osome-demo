AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: osome-demo serverless backend

Parameters:
  Port:
    Type: String
    Default: "3000"
  DbHost:
    Type: String
    Default: "127.0.0.1"
  DbPort:
    Type: String
    Default: "5432"
  DbUser:
    Type: String
    Default: "postgres"
  DbPassword:
    Type: String
    Default: "postgres"
  DbName:
    Type: String
    Default: "osome_demo"
  LogLevel:
    Type: String
    Default: "info"

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        PORT: !Ref Port
        DB_HOST: !Ref DbHost
        DB_PORT: !Ref DbPort
        DB_USER: !Ref DbUser
        DB_PASSWORD: !Ref DbPassword
        DB_NAME: !Ref DbName
        LOG_LEVEL: !Ref LogLevel

Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/lambda.healthHandler
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get
        ReadyApi:
          Type: Api
          Properties:
            Path: /ready
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda.ts
        Minify: false
        Sourcemap: true
        Target: es2020
        Format: cjs

  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/lambda.usersHandler
      Events:
        UsersListApi:
          Type: Api
          Properties:
            Path: /users
            Method: get
        UsersCreateApi:
          Type: Api
          Properties:
            Path: /users
            Method: post
        UsersStatusApi:
          Type: Api
          Properties:
            Path: /users/{id}/status
            Method: patch
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda.ts
        Minify: false
        Sourcemap: true
        Target: es2020
        Format: cjs
